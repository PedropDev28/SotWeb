<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="auth.title">Entrar — Los Indomables</title>
  <link rel="stylesheet" href="./src/assets/css/styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="./src/assets/img/logo.png" alt="Los Indomables" data-i18n-attr="alt:meta.brand">
        <span class="brand-text">
          <strong data-i18n="meta.brand">Los Indomables</strong>
          <span data-i18n="meta.taglineShort">Burning Blade</span>
        </span>
      </a>
      <button class="nav-toggle" type="button" data-i18n-attr="aria-label:nav.openMenu" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.home">Inicio</a></li>
        <li><a href="guias.html" data-i18n="nav.guides">Guías</a></li>
        <li><a href="index.html#novedades" data-i18n="nav.news">Novedades</a></li>
        <li><a href="#" data-discord-link data-i18n="nav.discord">Discord</a></li>
        <li><a href="cuenta.html" data-account-link class="hidden" data-i18n="nav.account">Mi cuenta</a></li>
        <li><a href="auth.html" data-auth-link data-i18n="nav.login">Entrar</a></li>
      </ul>
    </nav>
  </header>

  <main class="auth-wrap">
    <div class="panel auth-card auth-oauth">
      <h1 style="font-family: var(--font-display); color: var(--brass); font-size: 1.8rem; margin-bottom: 0.35rem;" data-i18n="auth.heading">
        Tripulación
      </h1>
      <p style="margin-bottom: 1.5rem; color: rgba(243,230,200,0.75);" data-i18n="auth.lead">
        Entra con Discord o Google para guardar el progreso y proponer ediciones.
      </p>

      <button type="button" class="btn btn-discord btn-block" id="discord-login" data-i18n="auth.discordCta">
        Continuar con Discord
      </button>

      <div class="form-divider" data-i18n="auth.or">o</div>

      <div id="google-btn"></div>
      <p class="form-msg" id="google-hint"></p>
      <p class="form-msg" id="form-msg"></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p data-i18n="footer.copy">© 2026 Los Indomables — Fan site no oficial de Sea of Thieves.</p>
      <ul class="footer-links">
        <li><a href="guias.html" data-i18n="nav.guides">Guías</a></li>
        <li><a href="#" data-discord-link data-i18n="nav.discord">Discord</a></li>
        <li><a href="index.html" data-i18n="nav.home">Inicio</a></li>
      </ul>
    </div>
  </footer>

  <script src="./src/assets/js/config.js"></script>
  <script src="./src/assets/js/i18n.js"></script>
  <script src="./src/assets/js/auth.js"></script>
  <script src="./src/assets/js/app.js"></script>
  <script src="./src/assets/js/atmosphere.js"></script>
  <script src="./src/assets/js/pages/auth.js"></script>
</body>
</html>
