<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Los Indomables</title>
  <link rel="stylesheet" href="./src/assets/css/styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="./src/assets/img/logo.png" alt="Los Indomables">
        <span class="brand-text">
          <strong>Los Indomables</strong>
          <span>Burning Blade</span>
        </span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="guias.html">Guías</a></li>
        <li><a href="index.html#novedades">Novedades</a></li>
        <li><a href="#" data-discord-link>Discord</a></li>
        <li><a href="cuenta.html" data-account-link class="hidden">Mi cuenta</a></li>
        <li><a href="auth.html" data-auth-link>Entrar</a></li>
      </ul>
    </nav>
  </header>

  <main class="auth-wrap">
    <div class="panel auth-card">
      <h1 style="font-family: var(--font-display); color: var(--brass); font-size: 1.8rem; margin-bottom: 0.35rem;">
        Tripulación
      </h1>
      <p style="margin-bottom: 1.25rem; color: rgba(243,230,200,0.75);">
        Entra para guardar el progreso de tus guías.
      </p>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" data-tab="login">Iniciar sesión</button>
        <button type="button" class="auth-tab" data-tab="register">Registrarse</button>
      </div>

      <form class="form" id="form-login">
        <div class="form-group">
          <label for="login-email">Correo</label>
          <input id="login-email" type="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input id="login-password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-block" type="submit">Entrar</button>
      </form>

      <form class="form hidden" id="form-register">
        <div class="form-group">
          <label for="reg-name">Nombre de pirata</label>
          <input id="reg-name" type="text" autocomplete="nickname" required>
        </div>
        <div class="form-group">
          <label for="reg-email">Correo</label>
          <input id="reg-email" type="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Contraseña</label>
          <input id="reg-password" type="password" autocomplete="new-password" minlength="6" required>
        </div>
        <button class="btn btn-block" type="submit">Crear cuenta</button>
      </form>

      <div class="form-divider">o</div>
      <div id="google-btn"></div>
      <p class="form-msg" id="google-hint"></p>
      <p class="form-msg" id="form-msg"></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>© 2026 Los Indomables — Fan site no oficial de Sea of Thieves.</p>
      <ul class="footer-links">
        <li><a href="guias.html">Guías</a></li>
        <li><a href="#" data-discord-link>Discord</a></li>
        <li><a href="index.html">Inicio</a></li>
      </ul>
    </div>
  </footer>

  <script src="./src/assets/js/config.js"></script>
  <script src="./src/assets/js/auth.js"></script>
  <script src="./src/assets/js/app.js"></script>
  <script src="./src/assets/js/pages/auth.js"></script>
</body>
</html>
